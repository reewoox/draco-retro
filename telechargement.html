<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="dl.title">Télécharger le launcher — Draco Retro</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/site.css?v=6a3b3e1ae6">
</head>
<body>
<main class="form-page">
  <div class="wrap dl">
    <div class="dl-box">
      <div class="eyebrow" data-i18n="dl.eyebrow"></div>
      <h1 style="margin:0" data-i18n="dl.h1"></h1>
      <p style="color:#d9c8b3;margin:0" data-i18n="dl.p"></p>
      <div id="dl"><button class="btn fire big" disabled data-i18n="loading"></button></div>
      <div class="meta" id="meta"></div>
      <h3 style="font-family:var(--display);color:var(--gold2);margin:10px 0 0" data-i18n="dl.install"></h3>
      <ol class="steps">
        <li data-i18n-html="dl.s1"></li>
        <li data-i18n-html="dl.s2"></li>
        <li data-i18n-html="dl.s3"></li>
      </ol>
      <p style="margin:0;color:var(--muted);font-size:14px" data-i18n-html="dl.smartscreen"></p>
    </div>
    <div class="crest"><img src="assets/logo.png" alt="Draco Retro"></div>
  </div>
  <div class="wrap grid3" style="margin-top:40px">
    <div class="card"><h3 data-i18n="dl.c1.h"></h3><p data-i18n="dl.c1.p"></p></div>
    <div class="card"><h3 data-i18n="dl.c2.h"></h3><p data-i18n="dl.c2.p"></p></div>
    <div class="card"><h3 data-i18n="dl.c3.h"></h3><p data-i18n="dl.c3.p"></p></div>
  </div>
</main>
<script src="assets/i18n.js?v=e85817fd89"></script>
<script src="assets/i18n-x.js?v=9e3d325a49"></script>
<script src="assets/site.js?v=4300f90196"></script>
<script>
header('telechargement');
const size = b => b > 1e9 ? (b / 1e9).toLocaleString(locale(), {maximumFractionDigits: 1}) + ' ' + t('unit.gb') : Math.round(b / 1e6) + ' ' + t('unit.mb');
let info = null, href = null;
function renderDownload() {
  if (info === 'error') { $('#dl').innerHTML = `<button class="btn fire big" disabled>${esc(t('dl.unavailable'))}</button>`; return; }
  if (!info.url) { $('#dl').innerHTML = `<button class="btn fire big" disabled>${esc(t('dl.soon'))}</button>`; $('#meta').textContent = t('dl.soonP'); return; }
  $('#dl').innerHTML = `<a class="btn fire big" href="${esc(href)}" download>${esc(t('dl.btn'))}</a>`;
  $('#meta').innerHTML = [info.version ? t('dl.version', {v: info.version}) : '', info.size ? size(info.size) : '', info.date ? t('dl.updated', {d: new Date(info.date).toLocaleDateString(locale())}) : '']
    .filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('');
}
api('/api/download').then(async d => { info = d; if (d.url) href = await apiUrl(d.url); renderDownload(); }).catch(() => { info = 'error'; renderDownload(); });
document.addEventListener('langchange', () => { if (info) renderDownload(); });
</script>
</body>
</html>
