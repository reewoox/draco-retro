<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="news.title">Draco Retro</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/site.css?v=ec87e2cae9">
</head>
<body>
<main class="form-page">
  <div class="wrap">
    <div class="section-head"><div class="eyebrow" data-i18n="news.eyebrow"></div><h2 data-i18n="news.h2"></h2></div>
    <div class="news-list" id="news"></div>
  </div>
</main>
<script src="assets/i18n.js?v=a65198e5fe"></script>
<script src="assets/site.js?v=b6826f6277"></script>
<script>
header('actualites');
let items = null;
function render() {
  if (!items) return;
  $('#news').innerHTML = items.map(n => `<article class="card news-card"><div class="news-meta"><span class="news-kind">${esc(t('news.kind.' + n.kind))}${n.version ? ' v' + n.version : ''}</span><span>${esc(new Date(n.date).toLocaleDateString(locale(), {day: 'numeric', month: 'long', year: 'numeric'}))}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></article>`).join('') || `<p class="empty">${esc(t('news.empty'))}</p>`;
}
api('/api/news').then(r => { items = r; render(); }).catch(() => { items = []; render(); });
document.addEventListener('langchange', render);
</script>
</body>
</html>
