<body>
<main class="form-page">
  <div class="wrap">
    <div class="section-head"><div class="eyebrow" data-i18n="news.eyebrow"></div><h2 data-i18n="news.h2"></h2></div>
    <div class="news-list" id="news"></div>
  </div>
</main>
<script src="assets/i18n.js?v=9bd1e9d5f1"></script>
<script src="assets/i18n-x.js?v=a978bbcc8f"></script>
<script src="assets/i18n-x2.js?v=896a34372d"></script>
<script src="assets/site.js?v=43d1dcde55"></script>
<script>
header('actualites');
let items = null;
function render() {
  if (!items) return;
  $('#news').innerHTML = items.map(n => `<article class="card news-card" id="n${Number(n.id)}" style="scroll-margin-top:90px"><div class="news-meta"><span class="news-kind">${esc(t('news.kind.' + n.kind))}${n.version ? ' v' + n.version : ''}</span><span>${esc(new Date(n.date).toLocaleDateString(locale(), {day: 'numeric', month: 'long', year: 'numeric'}))}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></article>`).join('') || `<p class="empty">${esc(t('news.empty'))}</p>`;
  if (/^#n\d+$/.test(location.hash)) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}
api('/api/news').then(r => { items = r; render(); }).catch(() => { items = []; render(); });
document.addEventListener('langchange', render);
</script>
</body>
</html>
