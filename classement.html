<head>
<meta charset="utf-8">

<meta property="og:description" content="Classements de Draco Retro : niveau, expérience, succès, kamas, honneur, victoires PvP, guildes et votes.">

<link rel="stylesheet" href="assets/site.css?v=b76074cf1a">
</head>
<body>
<main class="form-page">
  <div class="wrap">
    <div class="page-head"><div><div class="eyebrow" data-i18n="ladder.eyebrow"></div><h1 data-i18n="ladder.h2"></h1><p data-i18n="rk.p"></p></div></div>
    <div class="tabs-bar" id="kinds"></div>
    <div class="row between" style="margin-bottom:14px">
      <label class="row" style="color:var(--muted)" id="classBox"><span data-i18n="ladder.class"></span><select id="classPick"></select></label>
      <label class="search"><span class="ms">search</span><input type="search" id="q" data-i18n-ph="rk.search"></label>
    </div>
    <div class="rank-list" id="rows"></div>
  </div>
</main>
<script src="assets/i18n.js?v=e85817fd89"></script>
<script src="assets/i18n-x.js?v=9e3d325a49"></script>
<script src="assets/i18n-x2.js?v=c330ebda9c"></script>
<script src="assets/site.js?v=a5cfb608bf"></script>
<script>
header('classement');
const KINDS = ['level', 'successes', 'kamas', 'honor', 'kills', 'guilds', 'votes'];
const NO_CLASS = ['guilds', 'votes'];
let kind = KINDS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'level', classId = '', data = null, legacy = false, query = '';
function renderControls() {
  $('#kinds').innerHTML = (legacy ? ['level'] : KINDS).map(k => `<button class="${k === kind ? 'on' : ''}" data-kind="${k}">${esc(t('rk.' + k))}</button>`).join('');
  $('#classPick').innerHTML = `<option value="">${esc(t('rk.allClasses'))}</option>` + t('classes').map((n, i) => `<option value="${i + 1}" ${String(i + 1) === classId ? 'selected' : ''}>${esc(n)}</option>`).join('');
  $('#classBox').style.visibility = legacy || NO_CLASS.includes(kind) ? 'hidden' : '';
}
const valueLabel = () => kind === 'guilds' ? t('rk.membersLabel') : t('rk.' + (kind === 'level' ? 'xp' : kind));
function render() {
  renderControls();
  if (data === null) { $('#rows').innerHTML = spinner(); return; }
  if (data === 'error') { $('#rows').innerHTML = `<p class="empty">${esc(t('ladder.error'))}</p>`; return; }
  const q = query.trim().toLowerCase(), list = q ? data.filter(r => String(r.name).toLowerCase().includes(q)) : data;
  $('#rows').innerHTML = list.map(r => `<div class="rank-row ${r.rank <= 3 ? 'top r' + r.rank : ''}">
      <span class="pos">${r.rank <= 3 ? '<span class="ms">emoji_events</span>' : r.rank}</span>
      ${r.class_id ? `<img src="${classImg(r.class_id, r.sex)}" alt="${esc(className(r.class_id))}" title="${esc(className(r.class_id))}">` : `<span class="ms" style="font-size:34px;color:var(--gold);justify-self:center">${kind === 'guilds' ? 'shield' : 'person'}</span>`}
      <span class="name"><b>${esc(r.name)}${r.online ? ' <span class="dot on" title="' + esc(t('st.online')) + '"></span>' : ''}</b><small>${r.level != null ? esc(t('shop.level', {n: r.level})) : ''}${r.class_id ? ' · ' + esc(className(r.class_id)) : ''}</small></span>
      <span class="val"><b>${fmt(kind === 'level' ? (r.xp ?? r.value) : r.value)}</b><small>${esc(kind === 'level' && r.xp == null ? t('rk.level') : valueLabel())}</small></span>
    </div>`).join('') || `<p class="empty">${esc(t(q ? 'wiki.none' : 'ladder.empty'))}</p>`;
}
async function load() {
  data = null; render();
  try { data = (await x('rankings', {kind: kind === 'level' ? 'xp' : kind, classId: classId || undefined})).rows; if (kind === 'level') data = data.map(r => ({...r, xp: r.value})); }
  catch (e) {
    // API of the player pages not deployed yet: the classic level ladder.
    try { const rows = await api('/api/ladder'); legacy = true; kind = 'level'; data = rows.map(p => ({...p, value: p.level})); }
    catch { data = 'error'; }
  }
  render();
}
$('#kinds').addEventListener('click', e => { const b = e.target.closest('[data-kind]'); if (!b || b.dataset.kind === kind) return; kind = b.dataset.kind; history.replaceState(null, '', '#' + kind); load(); });
$('#classPick').onchange = e => { classId = e.target.value; load(); };
$('#q').addEventListener('input', e => { query = e.target.value; render(); });
document.addEventListener('langchange', render);
load();
</script>
</body>
</html>
