<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="reg.title">Créer un compte — Draco Retro</title>
<meta name="description" content="Crée gratuitement ton compte Draco (e-mail) et ton premier compte de jeu pour rejoindre le serveur Draco Retro.">
<meta name="theme-color" content="#0c0907">
<link rel="canonical" href="https://reewoox.github.io/draco-retro/inscription.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Draco Retro">
<meta property="og:title" content="Créer un compte — Draco Retro">
<meta property="og:description" content="Crée gratuitement ton compte Draco (e-mail) et ton premier compte de jeu pour rejoindre le serveur Draco Retro.">
<meta property="og:url" content="https://reewoox.github.io/draco-retro/inscription.html">
<meta property="og:image" content="https://reewoox.github.io/draco-retro/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..500,0..1,0&display=block">
<link rel="stylesheet" href="assets/site.css?v=92e0d93d54">
</head>
<body>
<main class="form-page">
  <div class="wrap form-shell">
    <div>
      <div class="eyebrow" data-i18n="reg.eyebrow"></div>
      <h2 style="margin-top:10px" data-i18n="reg.h2"></h2>
      <p style="color:var(--muted)" data-i18n="reg.p"></p>
      <div class="aside-list">
        <div class="card"><h3 data-i18n="reg.c1.h"></h3><p data-i18n="reg.c1.p"></p></div>
        <div class="card"><h3 data-i18n="reg.c2.h"></h3><p data-i18n="reg.c2.p"></p></div>
        <div class="card"><h3 data-i18n="reg.c3.h"></h3><p data-i18n="reg.c3.p"></p></div>
      </div>
    </div>

    <form class="form" id="form" novalidate>
      <div id="formBody">
        <h1 data-i18n="nav.register"></h1>
        <div style="display:grid;gap:16px;margin-top:16px">
          <h3 style="margin:0;color:var(--gold2)" data-i18n="reg.master"></h3>
          <label><span data-i18n="f.email"></span><input type="email" name="email" maxlength="190" autocomplete="email" data-i18n-ph="f.emailPh" required><span class="field-err" data-for="email"></span></label>
          <div class="row2">
            <label><span data-i18n="f.pw"></span><input type="password" name="password" maxlength="30" autocomplete="new-password" data-i18n-ph="f.pwPh" required><span class="field-err" data-for="password"></span></label>
            <label><span data-i18n="f.confirm"></span><input type="password" name="password_confirmation" maxlength="30" autocomplete="new-password" required><span class="field-err" data-for="password_confirmation"></span></label>
          </div>
          <p style="margin:0;color:var(--muted);font-size:13px" data-i18n="reg.pwBoth"></p>
          <h3 style="margin:8px 0 0;color:var(--gold2)" data-i18n="reg.game"></h3>
          <label><span data-i18n="f.login"></span><input type="text" name="login" maxlength="20" autocomplete="username" data-i18n-ph="f.loginPh" required><span class="field-err" data-for="login"></span></label>
          <label><span data-i18n="f.nick"></span><input type="text" name="pseudo" maxlength="20" data-i18n-ph="f.nickPh" required><span class="field-err" data-for="pseudo"></span></label>
          <div class="hp" aria-hidden="true"><label>Site web<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
          <label class="check"><input type="checkbox" name="accept"> <span data-i18n-html="reg.accept"></span></label>
          <span class="field-err" data-for="accept"></span>
          <div class="alert error" id="error" hidden></div>
          <button class="btn fire big" id="submit" data-i18n="reg.submit"></button>
          <p style="margin:0;color:var(--muted);font-size:14px;text-align:center" data-i18n-html="reg.already"></p>
        </div>
      </div>
      <div class="success" id="success" hidden>
        <div class="big-check">✓</div>
        <h1 id="okTitle"></h1>
        <p style="color:#d9c8b3;margin:0" id="okText"></p>
        <a class="btn fire big" href="telechargement.html" data-i18n="cta.download"></a>
        <a class="btn" href="compte.html" data-i18n="nav.account"></a>
      </div>
    </form>
  </div>
</main>
<script src="assets/i18n.js?v=d90f11ecab"></script>
<script src="assets/i18n-x.js?v=fb3c393f10"></script>
<script src="assets/i18n-x2.js?v=fe413aaf1e"></script>
<script src="assets/site.js?v=43d1dcde55"></script>
<script>
header('inscription');
const form = $('#form');
let created = null;
function renderSuccess() {
  if (!created) return;
  $('#okTitle').textContent = t('reg.welcome', {name: created.pseudo});
  $('#okText').innerHTML = t('reg.okMaster', {login: esc(created.login), email: esc(created.email)});
}
document.addEventListener('langchange', renderSuccess);
form.addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form)); data.accept = form.accept.checked;
  form.querySelectorAll('.field-err').forEach(x => x.textContent = ''); form.querySelectorAll('input').forEach(x => x.classList.remove('invalid')); $('#error').hidden = true;
  const local = {};
  if (data.password !== data.password_confirmation) local.password_confirmation = t('err.pwMatch');
  if (!data.accept) local.accept = t('reg.acceptErr');
  if (String(data.password || '').length < 8) local.password = t('reg.pwBoth');
  if (Object.keys(local).length) return show(local);
  $('#submit').disabled = true;
  try {
    // Draco account (e-mail), then its first game account with the same password.
    const master = await api('/api/master/register', {method: 'POST', body: JSON.stringify({email: data.email, password: data.password})});
    try { localStorage.setItem('draco.master', master.token); } catch {}
    const game = await api('/api/master/accounts/create', {method: 'POST', body: JSON.stringify({token: master.token, login: data.login, pseudo: data.pseudo, password: data.password})});
    created = {login: game.name, pseudo: game.pseudo, email: master.master.email};
    renderSuccess();
    $('#formBody').hidden = true; $('#success').hidden = false; scrollTo({top: 0});
  } catch (error) { show(error.errors || {}, error.message); }
  finally { $('#submit').disabled = false; }
});
function show(errors, message) {
  for (const [key, text] of Object.entries(errors)) { const slot = form.querySelector(`[data-for="${key}"]`); if (slot) slot.textContent = trServer(text); form[key]?.classList?.add('invalid'); }
  if (message && !Object.keys(errors).length) { $('#error').textContent = message; $('#error').hidden = false; }
}
</script>
</body>
</html>
