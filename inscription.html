<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="reg.title">Créer un compte — Draco Retro</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/site.css?v=ec87e2cae9">
</head>
<body>
<main class="form-page">
  <div class="wrap form-shell">
    <div>
      <div class="eyebrow" data-i18n="reg.eyebrow"></div>
      <h2 style="margin-top:10px" data-i18n="reg.h2"></h2>
      <p style="color:var(--muted)" data-i18n="reg.p"></p>
      <div class="aside-list">
        <div class="card"><h3 data-i18n="reg.c1.h"></h3><p data-i18n="reg.c1.p"></p></div>
        <div class="card"><h3 data-i18n="reg.c2.h"></h3><p data-i18n="reg.c2.p"></p></div>
        <div class="card"><h3 data-i18n="reg.c3.h"></h3><p data-i18n="reg.c3.p"></p></div>
      </div>
    </div>

    <form class="form" id="form" novalidate>
      <div id="formBody">
        <h1 data-i18n="nav.register"></h1>
        <div style="display:grid;gap:16px;margin-top:16px">
          <label><span data-i18n="f.login"></span><input type="text" name="login" maxlength="20" autocomplete="username" data-i18n-ph="f.loginPh" required><span class="field-err" data-for="login"></span></label>
          <label><span data-i18n="f.nick"></span><input type="text" name="pseudo" maxlength="20" data-i18n-ph="f.nickPh" required><span class="field-err" data-for="pseudo"></span></label>
          <label><span data-i18n="f.email"></span><input type="email" name="email" maxlength="100" autocomplete="email" data-i18n-ph="f.emailPh" required><span class="field-err" data-for="email"></span></label>
          <div class="row2">
            <label><span data-i18n="f.pw"></span><input type="password" name="password" maxlength="30" autocomplete="new-password" data-i18n-ph="f.pwPh" required><span class="field-err" data-for="password"></span></label>
            <label><span data-i18n="f.confirm"></span><input type="password" name="password_confirmation" maxlength="30" autocomplete="new-password" required><span class="field-err" data-for="password_confirmation"></span></label>
          </div>
          <div class="hp" aria-hidden="true"><label>Site web<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
          <label class="check"><input type="checkbox" name="accept"> <span data-i18n-html="reg.accept"></span></label>
          <span class="field-err" data-for="accept"></span>
          <div class="alert error" id="error" hidden></div>
          <button class="btn fire big" id="submit" data-i18n="reg.submit"></button>
          <p style="margin:0;color:var(--muted);font-size:14px;text-align:center" data-i18n-html="reg.already"></p>
        </div>
      </div>
      <div class="success" id="success" hidden>
        <div class="big-check">✓</div>
        <h1 id="okTitle"></h1>
        <p style="color:#d9c8b3;margin:0" id="okText"></p>
        <a class="btn fire big" href="telechargement.html" data-i18n="cta.download"></a>
      </div>
    </form>
  </div>
</main>
<script src="assets/i18n.js?v=e5c9693fda"></script>
<script src="assets/site.js?v=b6826f6277"></script>
<script>
header('inscription');
const form = $('#form');
let created = null;
function renderSuccess() {
  if (!created) return;
  $('#okTitle').textContent = t('reg.welcome', {name: created.pseudo});
  $('#okText').innerHTML = t('reg.ok', {login: esc(created.login)});
}
document.addEventListener('langchange', renderSuccess);
form.addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form)); data.accept = form.accept.checked;
  form.querySelectorAll('.field-err').forEach(x => x.textContent = ''); form.querySelectorAll('input').forEach(x => x.classList.remove('invalid')); $('#error').hidden = true;
  const local = {};
  if (data.password !== data.password_confirmation) local.password_confirmation = t('err.pwMatch');
  if (!data.accept) local.accept = t('reg.acceptErr');
  if (Object.keys(local).length) return show(local);
  $('#submit').disabled = true;
  try {
    created = await api('/api/register', {method: 'POST', body: JSON.stringify(data)});
    renderSuccess();
    $('#formBody').hidden = true; $('#success').hidden = false; scrollTo({top: 0});
  } catch (error) { show(error.errors || {}, error.message); }
  finally { $('#submit').disabled = false; }
});
function show(errors, message) {
  for (const [key, text] of Object.entries(errors)) { const slot = form.querySelector(`[data-for="${key}"]`); if (slot) slot.textContent = trServer(text); form[key]?.classList?.add('invalid'); }
  if (message && !Object.keys(errors).length) { $('#error').textContent = message; $('#error').hidden = false; }
}
</script>
</body>
</html>
