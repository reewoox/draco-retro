<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="home.title">Draco Retro — Serveur privé Dofus Retro</title>
<meta name="description" content="Draco Retro : serveur privé Dofus Retro gratuit. Crée ton compte, télécharge le launcher et rejoins l'aventure.">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main>
  <section class="hero">
    <div class="wrap">
      <div>
        <div class="eyebrow" data-i18n="home.eyebrow"></div>
        <h1 data-i18n-html="home.h1"></h1>
        <p class="lead" data-i18n="home.lead"></p>
        <div class="ctas">
          <a class="btn fire big" href="telechargement.html" data-i18n="cta.download"></a>
          <a class="btn big" href="inscription.html" data-i18n="cta.register"></a>
        </div>
        <div class="strip">
          <div><b data-status="state">…</b><span data-i18n="strip.server"></span></div>
          <div><b data-status="online">—</b><span data-i18n="strip.online"></span></div>
          <div><b data-status="accounts">—</b><span data-i18n="strip.accounts"></span></div>
          <div><b data-status="players">—</b><span data-i18n="strip.players"></span></div>
        </div>
      </div>
      <div class="crest"><img src="assets/logo.png" alt="Draco Retro"></div>
    </div>
  </section>

  <section id="jouer">
    <div class="wrap">
      <div class="section-head"><div class="eyebrow" data-i18n="steps.eyebrow"></div><h2 data-i18n="steps.h2"></h2><p data-i18n="steps.p"></p></div>
      <div class="grid3">
        <div class="card"><div class="step-n">01</div><h3 data-i18n="step1.h"></h3><p data-i18n="step1.p"></p></div>
        <div class="card"><div class="step-n">02</div><h3 data-i18n="step2.h"></h3><p data-i18n-html="step2.p"></p></div>
        <div class="card"><div class="step-n">03</div><h3 data-i18n="step3.h"></h3><p data-i18n-html="step3.p"></p></div>
      </div>
    </div>
  </section>

  <section class="band">
    <div class="wrap" style="padding:34px 0">
      <div><div class="eyebrow" data-i18n="rates.eyebrow"></div><h2 data-i18n="rates.h2"></h2></div>
      <div class="grid4" style="flex:1;max-width:620px">
        <div class="rate"><b data-status="rate.xp">x1</b><span data-i18n="rate.xp"></span></div>
        <div class="rate"><b data-status="rate.drop">x1</b><span data-i18n="rate.drop"></span></div>
        <div class="rate"><b data-status="rate.kamas">x1</b><span data-i18n="rate.kamas"></span></div>
        <div class="rate"><b data-status="rate.job">x1</b><span data-i18n="rate.job"></span></div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="section-head"><div class="eyebrow" data-i18n="why.eyebrow"></div><h2 data-i18n="why.h2"></h2></div>
      <div class="grid3">
        <div class="card"><div class="icon">⭐</div><h3 data-i18n="why1.h"></h3><p data-i18n="why1.p"></p></div>
        <div class="card"><div class="icon">⚡</div><h3 data-i18n="why2.h"></h3><p data-i18n="why2.p"></p></div>
        <div class="card"><div class="icon">🎒</div><h3 data-i18n="why3.h"></h3><p data-i18n="why3.p"></p></div>
        <div class="card"><div class="icon">🌀</div><h3 data-i18n="why4.h"></h3><p data-i18n="why4.p"></p></div>
        <div class="card"><div class="icon">💎</div><h3 data-i18n="why5.h"></h3><p data-i18n="why5.p"></p></div>
        <div class="card"><div class="icon">🐉</div><h3 data-i18n="why6.h"></h3><p data-i18n="why6.p"></p></div>
      </div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="wrap">
      <div class="section-head"><div class="eyebrow" data-i18n="ladder.eyebrow"></div><h2 data-i18n="ladder.h2"></h2></div>
      <table class="table"><thead><tr><th>#</th><th data-i18n="ladder.char"></th><th data-i18n="ladder.class"></th><th data-i18n="ladder.level"></th></tr></thead><tbody id="top"><tr><td colspan="4" class="empty" data-i18n="loading"></td></tr></tbody></table>
      <p style="text-align:center;margin-top:20px"><a class="btn" href="classement.html" data-i18n="ladder.all"></a></p>
    </div>
  </section>

  <section class="band">
    <div class="wrap" style="padding:30px 0">
      <h2 data-i18n="end.h2"></h2>
      <div class="ctas"><a class="btn fire big" href="telechargement.html" data-i18n="cta.download.short"></a><a class="btn big" href="inscription.html" data-i18n="cta.register"></a></div>
    </div>
  </section>
</main>
<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>
<script>
header('index');
liveStatus(); setInterval(liveStatus, 30000);
let ladder = null;
function renderLadder() {
  $('#top').innerHTML = ladder === 'error' ? `<tr><td colspan="4" class="empty">${esc(t('ladder.error'))}</td></tr>`
    : ladder.slice(0, 5).map(p => `<tr><td class="rank">${p.rank}</td><td><span class="who"><img src="${classImg(p.class_id, p.sex)}" alt="">${esc(p.name)}</span></td><td>${esc(className(p.class_id) || p.className || '')}</td><td>${p.level}</td></tr>`).join('')
    || `<tr><td colspan="4" class="empty">${esc(t('ladder.empty'))}</td></tr>`;
}
api('/api/ladder').then(rows => { ladder = rows; renderLadder(); }).catch(() => { ladder = 'error'; renderLadder(); });
document.addEventListener('langchange', () => { if (ladder) renderLadder(); });
</script>
</body>
</html>
