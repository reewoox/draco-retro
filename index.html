<script>
header('index');
liveStatus(); setInterval(liveStatus, 30000);
let ladder = null, feed = null;
const MEDAL = ['var(--gold)', 'var(--silver)', 'var(--bronze)'];
function renderLadder() {
  $('#top').innerHTML = ladder === 'error' ? `<p class="muted small">${esc(t('ladder.error'))}</p>`
    : ladder.slice(0, 5).map((p, i) => `<a href="classement.html"><span style="text-align:center;font-family:var(--display);color:${MEDAL[i] || 'var(--muted)'}">${i < 3 ? '<span class="ms filled">emoji_events</span>' : i + 1}</span><img src="${classImg(p.class_id, p.sex)}" alt=""><span><b>${esc(p.name)}</b><br><small>${esc(className(p.class_id))}</small></span><small>${esc(t('shop.level', {n: p.level}))}</small></a>`).join('')
    || `<p class="muted small">${esc(t('ladder.empty'))}</p>`;
}
function renderNews() {
  if (!feed) return;
  const news = (feed.news || []).slice(0, 6);
  $('#homeNews').innerHTML = news.length ? news.map(n => `<a class="news-tile" data-kind="${esc(n.kind)}" href="actualites.html#n${Number(n.id)}"><div class="news-cover"><span class="badge">${esc(t('news.kind.' + n.kind))}</span></div><div class="t"><b>${esc(n.title)}</b><small><span class="ms">schedule</span>${esc(new Date(n.date).toLocaleDateString(locale(), {day: 'numeric', month: 'long', year: 'numeric'}))}</small></div></a>`).join('') : `<p class="muted small">${esc(t('news.empty'))}</p>`;
  if (feed.discord) { $('#homeDiscord').hidden = false; $('#homeDiscord').href = feed.discord; }
}
api('/api/ladder').then(rows => { ladder = rows; renderLadder(); }).catch(() => { ladder = 'error'; renderLadder(); });
document.addEventListener('langchange', () => { if (ladder) renderLadder(); renderNews(); });
document.addEventListener('sitefeed', e => { feed = e.detail; renderNews(); });
// Signed in: the hero button leads to the account instead of the sign-up form.
function renderCta() { const signed = !!getToken(); $('#heroCta').href = signed ? 'compte.html' : 'inscription.html'; $('#heroCta span:last-child').textContent = t(signed ? 'nav.account' : 'cta.register'); $('#heroCta .ms').textContent = signed ? 'person' : 'person_add'; }
document.addEventListener('session', renderCta); document.addEventListener('langchange', renderCta); renderCta();
</script>
